project_name: FreshView
seed: 42
device: auto
identification:
  model: models/yolo11n-seg.pt
  confidence_threshold: 0.25
classifier:
  architecture: convnextv2_atto.fcmae_ft_in1k
  pretrained: true
  num_classes: 2
  image_size: 224
training:
  batch_size: 16
  epochs: 10
  learning_rate: 0.0001
dataset:
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15
multiview:
  minimum_views: 1
  maximum_views: 3
  fusion_method: mean
uncertainty:
  confidence_threshold: null
  disagreement_threshold: null
